        <h2 style="margin-top: -3px; margin-bottom: -3px;">pac-man</h2>
    </div>


    <!-- ========================= -->
    <!-- NAME / START SCREEN -->
    <!-- ========================= -->

    <div id="startScreen">

        <p>Enter your name:</p>

        <input type="text" id="playerName" placeholder="Your name" maxlength="20">

        <br>

        <button onclick="startGame()"
            style="margin-bottom: 15px; margin-top: 10px; background-color: darkblue; color: white;">
            Start Game
        </button>

    </div>


    <!-- ========================= -->
    <!-- GAME -->
    <!-- ========================= -->

    <div id="gameArea">

        <p>
            Player:
            <span id="currentPlayer"></span>
        </p>

        <p>
            Score:
            <span id="score">0</span>
        </p>

        <div id="gameContainer" style="border: none;">

            <canvas id="game" width="390" height="420">
            </canvas>

        </div>

        <p>
            Use the arrow keys to move!
        </p>

        <button onclick="restartGame()"
            style="margin-bottom: 15px; margin-top: 10px; background-color: darkblue; color: white;">
            Restart
        </button>

    </div>


    <!-- ========================= -->
    <!-- LEADERBOARD -->
    <!-- ========================= -->

    <div id="leaderboard">

        <h2>Leaderboard</h2>

        <ol id="leaderboardList"></ol>

    </div>


    <script>

        // #################################
        // CANVAS
        // #################################

        const canvas = document.getElementById("game");

        const ctx = canvas.getContext("2d");


        // #################################
        // MAP
        // #################################

        const map = [

            "#############",
            "#...........#",
            "#.###.###.#.#",
            "#...........#",
            "#.###.#.###.#",
            "#.....P.....#",
            "#####.#.#####",
            "#.....G.....#",
            "#####.#.#####",
            "#.###.#.###.#",
            "#...........#",
            "#.###.###.#.#",
            "#...........#",
            "#############"

        ];


        const rows = map.length;

        const cols = map[0].length;


        // 13 columns × 30 = 390
        // 14 rows × 30 = 420
        const tileSize = 30;


        let player;

        let ghost;

        let dots;

        let score;

        let gameRunning;

        let playerName;

        let gameTimer;


        // #################################
        // START GAME
        // #################################

        function startGame() {

            const nameInput =
                document.getElementById("playerName");

            playerName = nameInput.value.trim();


            if (playerName === "") {

                alert("Please enter your name.");

                return;

            }


            document.getElementById("startScreen").style.display =
                "none";

            document.getElementById("gameArea").style.display =
                "block";


            document.getElementById("currentPlayer").textContent =
                playerName;


            restartGame();

        }


        // #################################
        // RESTART GAME
        // #################################

        function restartGame() {

            clearInterval(gameTimer);


            player = {

                x: 6,
                y: 5,

                dx: 0,
                dy: 0

            };


            ghost = {

                x: 6,
                y: 7,

                dx: 1,
                dy: 0

            };


            dots = new Set();


            score = 0;

            gameRunning = true;


            // Find all dots

            for (let y = 0; y < rows; y++) {

                for (let x = 0; x < cols; x++) {

                    if (map[y][x] === ".") {

                        dots.add(x + "," + y);

                    }

                }

            }


            document.getElementById("score").textContent =
                score;


            draw();


            gameTimer = setInterval(
                gameStep,
                180
            );

        }


        // #################################
        // CHECK WALL
        // #################################

        function isWall(x, y) {

            if (
                x < 0 ||
                x >= cols ||
                y < 0 ||
                y >= rows
            ) {

                return true;

            }


            return map[y][x] === "#";

        }


        // #################################
        // MOVE PLAYER
        // #################################

        function movePlayer() {

            const newX =
                player.x + player.dx;

            const newY =
                player.y + player.dy;


            if (!isWall(newX, newY)) {

                player.x = newX;

                player.y = newY;

            }


            // Check for dot

            const position =
                player.x + "," + player.y;


            if (dots.has(position)) {

                dots.delete(position);

                score += 10;


                document.getElementById("score").textContent =
                    score;

            }

        }


        // #################################
        // MOVE GHOST
        // #################################

        function moveGhost() {

            const directions = [

                { dx: 1, dy: 0 },

                { dx: -1, dy: 0 },

                { dx: 0, dy: 1 },

                { dx: 0, dy: -1 }

            ];


            let available =
                directions.filter(direction => {

                    return !isWall(

                        ghost.x + direction.dx,

                        ghost.y + direction.dy

                    );

                });


            if (available.length === 0) {

                return;

            }


            // Choose the direction
            // that gets closest to player

            available.sort((a, b) => {

                const distanceA =

                    Math.abs(
                        player.x -
                        (ghost.x + a.dx)
                    )

                    +

                    Math.abs(
                        player.y -
                        (ghost.y + a.dy)
                    );


                const distanceB =

                    Math.abs(
                        player.x -
                        (ghost.x + b.dx)
                    )

                    +

                    Math.abs(
                        player.y -
                        (ghost.y + b.dy)
                    );


                return distanceA - distanceB;

            });


            const direction =
                available[0];


            ghost.dx =
                direction.dx;

            ghost.dy =
                direction.dy;


            ghost.x +=
                ghost.dx;

            ghost.y +=
                ghost.dy;

        }


        // #################################
        // GAME LOOP
        // #################################

        function gameStep() {

            if (!gameRunning) {

                return;

            }


            movePlayer();


            // Check collision

            if (
                player.x === ghost.x &&
                player.y === ghost.y
            ) {

                endGame();

                return;

            }


            moveGhost();


            // Check collision again

            if (
                player.x === ghost.x &&
                player.y === ghost.y
            ) {

                endGame();

                return;

            }


            // Check win

            if (dots.size === 0) {

                gameRunning = false;

                clearInterval(gameTimer);


                saveScore();


                alert(
                    "You won!\nScore: " + score
                );


                return;

            }


            draw();

        }


        // #################################
        // GAME OVER
        // #################################

        function endGame() {

            gameRunning = false;

            clearInterval(gameTimer);


            saveScore();


            alert(
                "Game over!\nScore: " + score
            );

        }


        // #################################
        // SAVE SCORE
        // #################################

        function saveScore() {

            let leaderboard =
                JSON.parse(
                    localStorage.getItem(
                        "pacmanLeaderboard"
                    )
                ) || [];


            leaderboard.push({

                name: playerName,

                score: score

            });


            // Sort highest score first

            leaderboard.sort((a, b) =>
                b.score - a.score
            );


            // Keep only top 10

            leaderboard =
                leaderboard.slice(0, 10);


            localStorage.setItem(

                "pacmanLeaderboard",

                JSON.stringify(leaderboard)

            );


            displayLeaderboard();

        }


        // #################################
        // DISPLAY LEADERBOARD
        // #################################

        function displayLeaderboard() {

            const list =
                document.getElementById(
                    "leaderboardList"
                );


            list.innerHTML = "";


            const leaderboard =
                JSON.parse(
                    localStorage.getItem(
                        "pacmanLeaderboard"
                    )
                ) || [];


            leaderboard.forEach(entry => {

                const li =
                    document.createElement("li");


                li.textContent =
                    entry.name +
                    " - " +
                    entry.score;


                list.appendChild(li);

            });

        }


        // #################################
        // DRAW GAME
        // #################################

        function draw() {

            ctx.clearRect(

                0,
                0,
                canvas.width,
                canvas.height

            );


            // ==============================
            // WALLS
            // ==============================

            for (let y = 0; y < rows; y++) {

                for (let x = 0; x < cols; x++) {

                    if (map[y][x] === "#") {

                        ctx.fillStyle =
                            "darkblue";


                        ctx.fillRect(

                            x * tileSize,

                            y * tileSize,

                            tileSize,

                            tileSize

                        );

                    }

                }

            }


            // ==============================
            // DOTS
            // ==============================

            ctx.fillStyle = "white";


            dots.forEach(position => {

                const parts =
                    position.split(",");


                const x =
                    Number(parts[0]);

                const y =
                    Number(parts[1]);


                ctx.beginPath();


                ctx.arc(

                    x * tileSize +
                    tileSize / 2,

                    y * tileSize +
                    tileSize / 2,

                    3,

                    0,

                    Math.PI * 2

                );


                ctx.fill();

            });


            // ==============================
            // PAC-MAN
            // ==============================

            ctx.fillStyle =
                "yellow";


            ctx.beginPath();


            ctx.arc(

                player.x * tileSize +
                tileSize / 2,

                player.y * tileSize +
                tileSize / 2,

                tileSize * 0.38,

                0,

                Math.PI * 2

            );


            ctx.fill();


            // ==============================
            // GHOST
            // ==============================

            ctx.fillStyle =
                "red";


            ctx.beginPath();


            ctx.arc(

                ghost.x * tileSize +
                tileSize / 2,

                ghost.y * tileSize +
                tileSize / 2,

                tileSize * 0.34,

                Math.PI,

                0

            );


            ctx.lineTo(

                ghost.x * tileSize +
                tileSize * 0.84,

                ghost.y * tileSize +
                tileSize * 0.82

            );


            ctx.lineTo(

                ghost.x * tileSize +
                tileSize * 0.67,

                ghost.y * tileSize +
                tileSize * 0.68

            );


            ctx.lineTo(

                ghost.x * tileSize +
                tileSize * 0.50,

                ghost.y * tileSize +
                tileSize * 0.82

            );


            ctx.lineTo(

                ghost.x * tileSize +
                tileSize * 0.33,

                ghost.y * tileSize +
                tileSize * 0.68

            );


            ctx.lineTo(

                ghost.x * tileSize +
                tileSize * 0.16,

                ghost.y * tileSize +
                tileSize * 0.82

            );


            ctx.closePath();


            ctx.fill();

        }


        // #################################
        // KEYBOARD CONTROLS
        // #################################

        document.addEventListener(
            "keydown",
            function (event) {

                if (!gameRunning) {

                    return;

                }


                if (event.key === "ArrowUp") {

                    player.dx = 0;

                    player.dy = -1;

                }


                if (event.key === "ArrowDown") {

                    player.dx = 0;

                    player.dy = 1;

                }


                if (event.key === "ArrowLeft") {

                    player.dx = -1;

                    player.dy = 0;

                }


                if (event.key === "ArrowRight") {

                    player.dx = 1;

                    player.dy = 0;

                }

            }
        );


        // #################################
        // LOAD LEADERBOARD
        // #################################

        displayLeaderboard();

    </script>

    </footer>

</body>
