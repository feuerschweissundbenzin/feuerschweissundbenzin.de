<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Uncial+Antiqua&display=swap" rel="stylesheet">
    <title>feuerschweissundbenzin</title>
</head>

<style>
    body {
        background-color: rgb(43, 43, 76);
        color: white;
        font-family: 'Courier New', monospace;
        text-align: center;
        min-width: 700px;
    }

    div {
        border: 8px solid rgb(43, 43, 76);
        border-radius: 15px;
        background-color: black;
        max-width: 100%;
    }

    header {
        background-color: rgb(43, 43, 76);
        height: 70px;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    footer {
        background-color: rgb(43, 43, 76);
        height: 70px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 15px;
    }

    nav {
        height: 40px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 30px;
    }

    .item {
        position: relative;
        display: inline-block;
        cursor: pointer;
        padding-bottom: 10px;
        padding-top: 10px;
    }

    .popup {
        display: none;
        position: absolute;
        top: 100%;
        left: 50%;
        transform: translateX(-50%);
        background: black;
        padding: 10px;
        width: 140px;
        z-index: 10;
    }

    .item:hover .popup {
        display: block;
    }

    img {
        width: 600px;
        margin: 0 auto;
        border-radius: 10px;
        border: 3px solid black;
        max-width: 96%;
        height: auto;
    }

    video {
        width: 600px;
    }


    ul {
        text-align: left;
    }

    a {
        color: white;
        cursor: pointer;
    }

    input,
    button {
        padding: 10px;
        font-size: 16px;
        margin: 5px;
    }

    #privateContent {
        display: none;
    }

    #error {
        color: red;
    }
</style>

<body>
    <header>
        <h1>feuerschweissundbenzin</h1>
    </header>

    <!-- PASSWORD SCREEN -->
    <div id="passwordScreen" style="padding-bottom: 300px;">
        <h1 style="font-size: 40px; font-family: 'Uncial Antiqua', serif; padding-top: 40px; padding-bottom: 30px;">
            <i>pedo mellon a minno</i>
        </h1>

        <form id="passwordForm">
            <input type="password" id="passwordInput" placeholder="Enter password" required>

            <button type="submit">Unlock</button>
        </form>

        <p id="error"></p>
    </div>


    <!-- HIDDEN CONTENT -->
    <div id="privateContent">
        <h1>Hi Maus!</h1>
        <p>Hier gibts content nur für dich!</p>
        <video controls style="width: auto;">
            <source src="videos/explosion.mp4">
        </video>
    </div>


    <script>
        const correctPassword = "noviosopero67";

        document.getElementById("passwordForm")
            .addEventListener("submit", function (event) {

                event.preventDefault();

                const enteredPassword =
                    document.getElementById("passwordInput").value;

                if (enteredPassword === correctPassword) {

                    document.getElementById("passwordScreen")
                        .style.display = "none";

                    document.getElementById("privateContent")
                        .style.display = "block";

                } else {

                    document.getElementById("error")
                        .textContent = "Incorrect password.";

                }
            });
    </script>

    <footer><a href="index.html">zurück</a></footer>

</body>

</html>
