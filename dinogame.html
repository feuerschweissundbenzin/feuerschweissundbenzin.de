    <style>
        body {
            background-color: rgb(150, 82, 0);
            color: white;
            font-family: 'Courier New', monospace;
            text-align: center;
        }

        div {
            border: 8px solid rgb(150, 82, 0);
            border-radius: 15px;

        header {
            background-color: rgb(150, 82, 0);

            display: flex;
            align-items: center;
            justify-content: center;
        }

        footer {
            background-color: rgb(150, 82, 0);
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;

        nav {
            height: 40px;
            display: flex;

        #leaderboard ol {

        }

            margin: 5px;
        }
    </style>

<body>

    <header>
        <h1>feuerschweissundbenzin</h1>
    </header>
    <div>
        <nav>
            <a href="index.html">home</a>
            <a href="photos.html">photography</a>
            <div class="item" style="border: 0px solid rgb(150, 82, 0);"><u><b>games</b></u>
                <div class="popup" style="border: 2px solid rgb(150, 82, 0);">
                    <ul>
                        <li><a href="pacman.html">pac-man</a></li>
                        <li><a href="dinogame.html"><b>dino</b></a></li>
                        <li><a href="snake.html">snake</a></li>
                        <li><a href="tetris.html">tetris</a></li>
                    </ul>
                </div>
            </div>
            <div class="item" style="border: 0px solid rgb(150, 82, 0);"><u>language</u></div>
            <a href="contact.html">contact</a>
        </nav>
    </div>

    <div>
        <h2 style="margin-top: -3px; margin-bottom: -3px;">the dino game</h2>
    </div>

    <!-- START SCREEN -->
    <div id="startScreen">

        <p>Enter your name:</p>

        <input type="text" id="playerName" placeholder="Your name" maxlength="20">

        <br>

        <button onclick="startGame()"
            style="margin-bottom: 15px; margin-top: 10px; background-color: rgb(150, 82, 0); color: white;">
            Start Game
        </button>

    </div>


    <!-- GAME -->
    <div id="gameArea">

        <p>
            Player:
            <span id="currentPlayer"></span>
        </p>

        <p>
            Score:
            <span id="score">0</span>
        </p>

        <div id="gameContainer">

            <canvas id="game" width="800" height="250"></canvas>

        </div>

        <p>
            Press SPACE or &#x2191; to jump!
        </p>

        <button onclick="restartGame()"
            style="margin-bottom: 15px; margin-top: 10px; background-color: rgb(150, 82, 0); color: white;">
            Restart
        </button>

    </div>


    <!-- LEADERBOARD -->
    <div id="leaderboard">

        <h2>Leaderboard</h2>

        <ol id="leaderboardList"></ol>

    </div>


    <script>

        const canvas = document.getElementById("game");
        const ctx = canvas.getContext("2d");


        // -------------------------
        // GAME VARIABLES
        // -------------------------

        const groundY = 210;

        let playerName;
        let score;

        let gameRunning;
        let gameLoop;

        let speed;

        let cactusTimer;

        let dino;
        let cacti;

        let clouds;


        // -------------------------
        // START GAME
        // -------------------------

        function startGame() {

            const nameInput =
                document.getElementById("playerName");

            playerName =
                nameInput.value.trim();

            if (playerName === "") {

                alert("Please enter your name.");

                return;
            }


            document.getElementById(
                "startScreen"
            ).style.display = "none";

            document.getElementById(
                "gameArea"
            ).style.display = "block";


            document.getElementById(
                "currentPlayer"
            ).textContent = playerName;


            restartGame();
        }


        // -------------------------
        // RESTART
        // -------------------------

        function restartGame() {

            cancelAnimationFrame(gameLoop);

            clearTimeout(cactusTimer);


            score = 0;

            speed = 6;

            gameRunning = true;


            document.getElementById(
                "score"
            ).textContent = score;


            // Dinosaur

            dino = {

                x: 80,

                y: groundY - 50,

                width: 40,

                height: 50,

                velocityY: 0,

                jumping: false

            };


            // Cacti

            cacti = [];


            // Clouds

            clouds = [

                {
                    x: 200,
                    y: 50,
                    width: 60
                },

                {
                    x: 500,
                    y: 80,
                    width: 45
                },

                {
                    x: 700,
                    y: 40,
                    width: 70
                }

            ];


            draw();

            gameLoop = requestAnimationFrame(update);

        }


        // -------------------------
        // JUMP
        // -------------------------

        function jump() {

            if (!gameRunning) {
                return;
            }


            if (!dino.jumping) {

                dino.velocityY = -13;

                dino.jumping = true;

            }

        }


        // -------------------------
        // KEYBOARD
        // -------------------------

        document.addEventListener(
            "keydown",
            function (event) {

                if (
                    event.key === " " ||
                    event.key === "ArrowUp"
                ) {

                    event.preventDefault();

                    jump();

                }

            }
        );


        // -------------------------
        // UPDATE GAME
        // -------------------------

        function update() {

            if (!gameRunning) {
                return;
            }


            // -------------------------
            // DINO GRAVITY
            // -------------------------

            dino.velocityY += 0.7;

            dino.y += dino.velocityY;


            if (
                dino.y >= groundY - dino.height
            ) {

                dino.y =
                    groundY - dino.height;

                dino.velocityY = 0;

                dino.jumping = false;

            }


            // -------------------------
            // CREATE CACTUS
            // -------------------------

            if (
                Math.random() < 0.015
            ) {

                const height =
                    30 + Math.random() * 35;


                cacti.push({

                    x: canvas.width,

                    y: groundY - height,

                    width: 20,

                    height: height

                });

            }


            // -------------------------
            // MOVE CACTI
            // -------------------------

            for (
                let i = cacti.length - 1;
                i >= 0;
                i--
            ) {

                cacti[i].x -= speed;


                if (
                    cacti[i].x +
                    cacti[i].width < 0
                ) {

                    cacti.splice(i, 1);

                }

            }


            // -------------------------
            // MOVE CLOUDS
            // -------------------------

            clouds.forEach(
                cloud => {

                    cloud.x -= speed * 0.2;


                    if (
                        cloud.x +
                        cloud.width <
                        0
                    ) {

                        cloud.x =
                            canvas.width +
                            Math.random() * 200;

                    }

                }
            );


            // -------------------------
            // COLLISION
            // -------------------------

            for (const cactus of cacti) {

                if (
                    dino.x <
                    cactus.x +
                    cactus.width &&

                    dino.x +
                    dino.width >
                    cactus.x &&

                    dino.y <
                    cactus.y +
                    cactus.height &&

                    dino.y +
                    dino.height >
                    cactus.y
                ) {

                    endGame();

                    return;

                }

            }


            // -------------------------
            // SCORE
            // -------------------------

            score += 1;


            document.getElementById(
                "score"
            ).textContent =
                Math.floor(score / 10);


            // -------------------------
            // INCREASE SPEED
            // -------------------------

            speed += 0.001;


            draw();


            gameLoop =
                requestAnimationFrame(update);

        }


        // -------------------------
        // DRAW
        // -------------------------

        function draw() {

            ctx.clearRect(
                0,
                0,
                canvas.width,
                canvas.height
            );


            // -------------------------
            // SKY
            // -------------------------

            ctx.fillStyle = "white";

            ctx.fillRect(
                0,
                0,
                canvas.width,
                canvas.height
            );


            // -------------------------
            // CLOUDS
            // -------------------------

            ctx.fillStyle = "#dddddd";


            clouds.forEach(
                cloud => {

                    ctx.beginPath();

                    ctx.arc(
                        cloud.x + 15,
                        cloud.y + 10,
                        10,
                        0,
                        Math.PI * 2
                    );

                    ctx.arc(
                        cloud.x + 30,
                        cloud.y,
                        15,
                        0,
                        Math.PI * 2
                    );

                    ctx.arc(
                        cloud.x + 45,
                        cloud.y + 10,
                        10,
                        0,
                        Math.PI * 2
                    );

                    ctx.fill();

                }
            );


            // -------------------------
            // GROUND
            // -------------------------

            ctx.fillStyle = "black";

            ctx.fillRect(
                0,
                groundY,
                canvas.width,
                3
            );


            // -------------------------
            // DINO
            // -------------------------

            ctx.fillStyle = "black";


            // Body

            ctx.fillRect(
                dino.x,
                dino.y + 10,
                30,
                40
            );


            // Head

            ctx.fillRect(
                dino.x + 20,
                dino.y,
                25,
                25
            );


            // Tail

            ctx.fillRect(
                dino.x - 10,
                dino.y + 25,
                15,
                10
            );


            // Leg 1

            ctx.fillRect(
                dino.x + 5,
                dino.y + 45,
                8,
                10
            );


            // Leg 2

            ctx.fillRect(
                dino.x + 22,
                dino.y + 45,
                8,
                10
            );


            // Eye

            ctx.fillStyle = "white";

            ctx.fillRect(
                dino.x + 35,
                dino.y + 5,
                4,
                4
            );


            // -------------------------
            // CACTI
            // -------------------------

            ctx.fillStyle = "green";


            cacti.forEach(
                cactus => {

                    // Main cactus

                    ctx.fillRect(
                        cactus.x,
                        cactus.y,
                        cactus.width,
                        cactus.height
                    );


                    // Left branch

                    if (cactus.height > 40) {

                        ctx.fillRect(
                            cactus.x - 8,
                            cactus.y + 15,
                            8,
                            20
                        );

                    }


                    // Right branch

                    if (cactus.height > 50) {

                        ctx.fillRect(
                            cactus.x +
                            cactus.width,
                            cactus.y + 25,
                            8,
                            20
                        );

                    }

                }
            );

        }


        // -------------------------
        // GAME OVER
        // -------------------------

        function endGame() {

            gameRunning = false;

            cancelAnimationFrame(gameLoop);

            clearTimeout(cactusTimer);


            saveScore();


            alert(
                "Game over!\nScore: " +
                Math.floor(score / 10)
            );

        }


        // -------------------------
        // SAVE SCORE
        // -------------------------

        function saveScore() {

            let leaderboard =
                JSON.parse(
                    localStorage.getItem(
                        "dinoLeaderboard"
                    )
                ) || [];


            leaderboard.push({

                name: playerName,

                score: Math.floor(
                    score / 10
                )

            });


            leaderboard.sort(
                (a, b) =>
                    b.score - a.score
            );


            leaderboard =
                leaderboard.slice(0, 10);


            localStorage.setItem(
                "dinoLeaderboard",
                JSON.stringify(
                    leaderboard
                )
            );


            displayLeaderboard();

        }


        // -------------------------
        // DISPLAY LEADERBOARD
        // -------------------------

        function displayLeaderboard() {

            const list =
                document.getElementById(
                    "leaderboardList"
                );


            list.innerHTML = "";


            const leaderboard =
                JSON.parse(
                    localStorage.getItem(
                        "dinoLeaderboard"
                    )
                ) || [];


            leaderboard.forEach(
                entry => {

                    const li =
                        document.createElement(
                            "li"
                        );


                    li.textContent =
                        entry.name +
                        " - " +
                        entry.score;


                    list.appendChild(li);

                }
            );

        }


        // -------------------------
        // INITIAL LEADERBOARD
        // -------------------------

        displayLeaderboard();

    </script>

    <footer>
        <p>
            follow on <b><a href="https://www.instagram.com/feuerschweissundbenzin/" target="_blank">
                    instagram</a></b> for more...
        </p>
    </footer>

</body>
